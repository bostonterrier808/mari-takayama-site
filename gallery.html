<style>
/* Layout: 白いナビ → 写真の帯 → 色面（スレートブルー／モーブ）が交互に続く、写真主役の一枚ページ。
   参考サイトの配色を踏襲した単一テーマ（ダークモードでも同じ見た目） */
:root {
  --paper: #ffffff;
  --ink: #2c2a30;
  --ink-soft: #6a6670;
  --stage: #2d2b2f;       /* トップ写真の背景に合わせた暗いグレー */
  --slate: #6f83a6;       /* About・Gallery の青 */
  --mauve: #a8979a;       /* Works・Interview のモーブ */
  --rose: #bd9597;        /* Interview のカード */
  --on-color: #ffffff;
  --font-display: "Cormorant Garamond", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body: "EB Garamond", Garamond, "Times New Roman", serif;
  --step--1: 0.9375rem;
  --step-0: 1.125rem;
  --step-1: 1.5rem;
  --step-2: clamp(1.75rem, 3vw, 2.25rem);
  --step-3: clamp(2.5rem, 6vw, 4.25rem);
  --step-4: clamp(3rem, 9vw, 6.5rem);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
img { display: block; max-width: 100%; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }

.wrap {
  max-width: 76rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ナビ */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid #ecebee;
}
header.top ul {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 0.25rem clamp(1.25rem, 4vw, 3rem);
  list-style: none; margin: 0; padding-block: 1.1rem;
}
header.top a {
  font-family: var(--font-display); font-size: clamp(1.15rem, 2.4vw, 1.6rem);
  letter-spacing: 0.06em; text-decoration: none; color: var(--ink);
}
header.top a:hover { color: var(--slate); }

/* トップ */
.hero { background: var(--stage); color: var(--on-color); text-align: center; position: relative; overflow: hidden; }
/* 写真全体を見切れずに中央に置き、左右は写真の端の色に溶け込ませる。文字は中央（胴のあたり）に重ねる */
#home { scroll-margin-top: 12rem; }
.hero { height: max(26rem, min(56.25vw, 88vh)); display: grid; background: #232124; }
.hero-photo { position: absolute; inset: 0; display: flex; justify-content: center; }
.hero-photo img {
  width: auto; height: 100%; max-width: 100%; flex-shrink: 0; object-fit: contain; object-position: center;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
  mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
}
.hero-photo::after { content: ""; position: absolute; inset: 0; background: rgba(20, 18, 24, 0.12); }
.hero .wrap { position: relative; align-self: center; width: 100%; padding-block: 18% 0; text-shadow: 0 1px 18px rgba(0, 0, 0, 0.35); }
.hero .kicker { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--step-2); letter-spacing: 0.04em; }
.hero h1 { margin: 0.15em 0 0.35em; font-family: var(--font-display); font-weight: 600; font-size: var(--step-4); line-height: 1; letter-spacing: 0.02em; text-wrap: balance; }
.hero .sub { margin: 0; font-size: var(--step-1); }
@media (max-width: 760px) {
  /* スマホでは文字を写真の上に分けて置き（手と重ならない）、写真の下の床部分は少し削る */
  .hero { height: auto; display: flex; flex-direction: column; background: #252224; } /* 写真の上端と同じ色 */
  .hero-photo::after { display: none; }
  .hero .wrap { order: 0; position: relative; z-index: 1; padding-block: 1.25rem 0; }
  .hero-photo { order: 1; position: relative; inset: auto; display: block; margin-top: -4.75rem; height: auto; overflow: hidden; }
  .hero-photo img { width: 100%; height: auto; object-fit: contain; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 20%); mask-image: linear-gradient(to bottom, transparent, #000 20%); }
  .hero .kicker { font-size: 1.05rem; }
  .hero h1 { font-size: 2.25rem; margin: 0.1em 0 0.2em; }
  .hero .sub { font-size: 0.95rem; }
}

/* 写真付きの見出し帯（WORKS / GALLERY） */
.banner { position: relative; overflow: hidden; color: var(--on-color); }
.banner img { width: 100%; height: clamp(9rem, 17vw, 16rem); object-fit: cover; object-position: 30% 35%; }
.banner.works { background: #3a3a3a; }
.banner.gallery { background: #120c0c; }
.banner.gallery img { object-position: 40% 50%; }
.banner::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.45), transparent 55%); z-index: 1; }
.banner .wrap { position: absolute; inset: 0; display: flex; align-items: center; z-index: 2; left: 0; right: 0; }
.banner h2, .plain-banner h2 {
  margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--step-3);
  letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
}

/* About */
.about { background: var(--slate); color: var(--on-color); }
.about .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(2rem, 6vw, 6rem); align-items: center; padding-block: clamp(3rem, 6vw, 5rem); }
.about img { width: 100%; aspect-ratio: 805 / 850; object-fit: cover; }
.about h2, .row h3 { margin: 0 0 0.5rem; font-family: var(--font-display); font-weight: 600; font-size: var(--step-2); letter-spacing: 0.03em; }
.about p { margin: 0 0 1em; max-width: 34em; }
.about .meta { list-style: none; padding: 0; margin: 1.75rem 0 0; display: grid; gap: 0.35rem; border-top: 1px solid rgba(255,255,255,0.4); padding-top: 1.25rem; }
.about .meta li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 1rem; }
.about .meta span { font-size: var(--step--1); letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; }

/* Works */
.works-body { background: var(--mauve); color: var(--on-color); }
.works-body .wrap { padding-block: clamp(3rem, 6vw, 5rem); display: grid; gap: clamp(3rem, 6vw, 5rem); }
.row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(2rem, 6vw, 5rem); align-items: center; }
.row.flip { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
.row.flip .row-photo { order: -1; }
.row p { margin: 0; max-width: 34em; }
.row .tag { display: block; font-size: var(--step--1); letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; margin-bottom: 0.25rem; }
.row-photo img { width: 100%; object-fit: cover; }
.row-photo.tall img { aspect-ratio: 562 / 888; max-height: 38rem; }
.row-photo.wide img { aspect-ratio: 566 / 422; }
.more { text-align: center; }
.more a {
  display: inline-block; font-family: var(--font-display); font-size: var(--step-1); text-decoration: none;
  background: #6e6a70; color: var(--on-color); padding: 0.35em 1.4em; border-radius: 6px 6px 0 0;
}
.more a:hover { background: var(--ink); }

/* Gallery */
.gallery-body { background: radial-gradient(ellipse at top, #302932, #1b181e 70%); }
.gallery-body .wrap { padding-block: clamp(2.5rem, 5vw, 4rem); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(0.75rem, 2vw, 2.25rem); }
.grid button { all: unset; cursor: zoom-in; display: block; }
.grid button:focus-visible { outline: 2px solid var(--on-color); outline-offset: 4px; }
.grid img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; transition: transform 0.4s ease, filter 0.4s ease; }
@media (prefers-reduced-motion: reduce) { .grid img { transition: none; } }

#gallery .banner .wrap h2 { letter-spacing: 0.12em; text-shadow: 0 2px 24px rgba(0,0,0,0.6); }
#gallery #grid { counter-reset: gallery-photo; }
#gallery #grid > button {
  position: relative;
  counter-increment: gallery-photo;
  outline: 1px solid rgba(246,229,210,0.22);
  outline-offset: 2px;
}
#gallery #grid > button:hover,
#gallery #grid > button:focus-visible { outline-color: #e7cfb4; }
#gallery #grid > button::after {
  content: counter(gallery-photo, decimal-leading-zero);
  position: absolute;
  right: 0.45rem;
  bottom: 0.45rem;
  padding: 0.2rem 0.35rem;
  background: rgba(24,20,26,0.82);
  color: #fff4e6;
  font: 0.65rem/1.1 system-ui, sans-serif;
  letter-spacing: 0.12em;
  pointer-events: none;
}

.lightbox {
  position: fixed; inset: 0; z-index: 20; background: rgba(20, 18, 22, 0.92);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lightbox img { max-height: 86vh; width: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.lightbox button {
  position: absolute; background: none; border: 0; color: #fff; font-family: var(--font-display);
  font-size: 2.25rem; line-height: 1; cursor: pointer; padding: 0.5rem 0.75rem;
}
.lb-close { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); right: calc(env(safe-area-inset-right, 0px) + 0.75rem); }
.lb-prev { left: calc(env(safe-area-inset-left, 0px) + 0.5rem); top: 50%; transform: translateY(-50%); }
.lb-next { right: calc(env(safe-area-inset-right, 0px) + 0.5rem); top: 50%; transform: translateY(-50%); }

/* Interview */
.interview { background: var(--mauve); color: var(--on-color); }
.plain-banner .wrap { padding-block: clamp(3rem, 7vw, 5.5rem) clamp(2rem, 4vw, 3rem); border-bottom: 1px solid rgba(255,255,255,0.35); }
.qa { max-width: 52rem; margin: 0 auto; display: grid; gap: 1.75rem; padding-block: clamp(2.5rem, 5vw, 4rem) clamp(3rem, 6vw, 5rem); }
.qa article { background: var(--rose); padding: clamp(1.5rem, 3vw, 2.5rem) clamp(1.25rem, 3vw, 2.75rem); }
.qa h3 { margin: 0 0 0.75rem; font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); line-height: 1.35; }
.qa h3 span { display: block; font-size: var(--step--1); letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; font-weight: 500; }
.qa p { margin: 0; }

/* Footer */
footer { background: var(--paper); color: var(--ink); }
footer .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: end; padding-block: clamp(2.5rem, 5vw, 4rem); }
footer nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; }
footer nav a { font-family: var(--font-display); font-size: var(--step-1); letter-spacing: 0.06em; text-decoration: none; }
footer nav a:hover { color: var(--slate); }
.sign { text-align: right; display: grid; gap: 0.5rem; justify-items: end; }
.sign .name { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--step-2); line-height: 1.1; }
.sign .mail { margin: 0; font-family: var(--font-display); font-size: var(--step-1); word-break: break-all; user-select: all; }
.copy { font: inherit; font-size: var(--step--1); background: none; color: var(--ink-soft); border: 1px solid #d9d7dc; padding: 0.2em 0.9em; cursor: pointer; }
.copy:hover { color: var(--ink); border-color: var(--ink); }
.social { display: flex; gap: 1.25rem; margin-top: 0.75rem; }
.social a { color: var(--ink); display: block; }
.social a:hover { color: var(--slate); }
.social svg { width: 30px; height: 30px; display: block; }
.legal { text-align: center; font-size: var(--step--1); color: var(--ink-soft); padding-bottom: 2rem; margin: 0; }

@media (max-width: 760px) {
  .about .wrap, .row, .row.flip { grid-template-columns: 1fr; }
  .row.flip .row-photo { order: 0; }
  .row-photo.tall img { max-height: 28rem; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  footer .wrap { grid-template-columns: 1fr; }
  .sign { text-align: left; justify-items: start; }
}

<div class="lightbox" id="lightbox" hidden="" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img id="lb-img" src="" alt="">
  <button class="lb-close" id="lb-close" type="button" aria-label="Close">×</button>
  <button class="lb-prev" id="lb-prev" type="button" aria-label="Previous photo">‹</button>
  <button class="lb-next" id="lb-next" type="button" aria-label="Next photo">›</button>
</div>

<script>
// メールアドレスのコピー
document.getElementById('copy-mail').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  const mail = document.getElementById('mail');
  try {
    await navigator.clipboard.writeText(mail.textContent);
    btn.textContent = 'Copied';
  } catch {
    const r = document.createRange(); r.selectNodeContents(mail);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = 'Selected. Press ⌘C to copy';
  }
  setTimeout(() => { btn.textContent = 'Copy email'; }, 2400);
});
</script>
<script>
// ギャラリーの拡大表示
(() => {
  const items = [...document.querySelectorAll('#grid button')];
  const box = document.getElementById('lightbox');
  const img = document.getElementById('lb-img');
  let i = 0, opener = null;
  function show(n) {
    i = (n + items.length) % items.length;
    const src = items[i].querySelector('img');
    img.src = src.src; img.alt = src.alt;
  }
  function open(n) { opener = items[n]; show(n); box.hidden = false; document.getElementById('lb-close').focus(); }
  function close() { box.hidden = true; opener && opener.focus(); }
  items.forEach((b, n) => b.addEventListener('click', () => open(n)));
  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', () => show(i - 1));
  document.getElementById('lb-next').addEventListener('click', () => show(i + 1));
  box.addEventListener('click', (e) => { if (e.target === box) close(); });
  addEventListener('keydown', (e) => {
    if (box.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(i - 1);
    if (e.key === 'ArrowRight') show(i + 1);
  });
})();
</script>
